name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  bookmarklet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Self-check and regenerate bookmark
        run: node twitter-delete.script.js --write-bookmark
      - name: Committed twitter-delete.txt matches build
        run: |
          git diff --exit-code twitter-delete.txt || (
            echo 'Run: node twitter-delete.script.js --write-bookmark'
            echo 'Then commit twitter-delete.txt'
            exit 1
          )
