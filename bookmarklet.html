  <script>
    (function () {
      var url = document.getElementById('twitterdelete-bookmark').getAttribute('href');
      document.getElementById('bookmark-code').value = url;
    })();
    document.getElementById('copy-code').addEventListener('click', function () {
      var url = document.getElementById('bookmark-code').value;
      function ok() {
        document.getElementById('copy-msg').textContent = 'Copied.';
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(ok).catch(function () {
          window.prompt('Copy this URL into your bookmark:', url);
        });
      } else {
        window.prompt('Copy this URL into your bookmark:', url);
      }
    });
